name: Publish built files

# On a version tag (v0.1.0), build the bundle and publish it to the `dist` branch and a `dist-<version>` tag, which
# jsDelivr serves. Can also be run by hand with a version of your choice (for example v0.0.1-test).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example v0.0.1-test'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/publish-dist.sh "$VERSION"
